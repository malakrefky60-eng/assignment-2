<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9 ﻧﻤﻮذج اﻟﺘﺴﺠﻴﻞ ﻓﻲ اﻟﻤﻘﺮر - اﻟﻤﺤﺎﺿﺮة</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f2f2f2; }
    form { background: #ffffff; padding: 20px; max-width: 600px; margin: auto; border-radius: 8px; boxshadow: 0 2px 5px rgba(0,0,0,0.1); }
    fieldset { margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; padding: 12px; }
    legend { font-weight: bold; color: #1B365D; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input[type="text"], input[type="email"], input[type="password"], input[type="date"], select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    input:invalid { border-color: #C00000; }
    button { margin-top: 15px; padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button[type="reset"] { background: #6c757d; margin-right: 5px; }
    button:hover { opacity: 0.9; }
    </style>
    </head>
    <body>
        <h2 style="text-align: center; color: #1B365D;">ﻧﻤﻮذج اﻟﺘﺴﺠﻴﻞ ﻓﻲ اﻟﻤﻘﺮر</h2>
        <form action="/register" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>اﻟﺒﻴﺎﻧﺎت اﻟﺸﺨﺼﻴﺔ</legend>
                <label for="fullname">اﻻﺳﻢ اﻟﻜﺎﻣﻞ:</label>
                <input type="text" id="fullname" name="fullname" placeholder="أدﺧﻞ اﻻﺳﻢ اﻟﻜﺎﻣﻞ" required minlength="3">
                <label for="email">اﻟﺒﺮﻳﺪ اﻹﻟﻜﺘﺮوﻧﻲ:</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                <label for="pwd">ﻛﻠﻤﺔ اﻟﻤﺮور:</label> 
                <input type="password" id="pwd" name="pwd" required minlength="6">
                <label for="birth">ﺗﺎرﻳﺦ اﻟﻤﻴﻼد:</label>
                 <input type="date" id="birth" name="birth">
                 </fieldset>
                 <fieldset>
                    <legend>ﻃﺮﻳﻘﺔ اﻟﺘﻮاﺻﻞ اﻟﻤﻔﻀﻠﺔ</legend>
                    <label><input type="radio" name="contact" value="email" checked> اﻟﺒﺮﻳﺪ اﻹﻟﻜﺘﺮوﻧﻲ</label>
                    <label><input type="radio" name="contact" value="phone"> اﻟﻬﺎﺗﻒ</label>
                 </fieldset>
                 <label for="country">اﻟﺪوﻟﺔ:</label>
                 <select id="country" name="country">
                    <option value="eg">ﻣﺼﺮ</option>
                    <option value="sa">اﻟﻤﻤﻠﻜﺔ اﻟﻌﺮﺑﻴﺔ اﻟﺴﻌﻮدﻳﺔ</option>
                    <option value="ae">اﻹﻣﺎرات اﻟﻌﺮﺑﻴﺔ اﻟﻤﺘﺤﺪة</option> 
                </select>

<label for="cv">رﻓﻊ اﻟﺴﻴﺮة اﻟﺬاﺗﻴﺔ (ﻣﻠﻒ PDF):</label>
<input type="file" id="cv" name="cv" accept=".pdf">
<label><input type="checkbox" name="terms" value="yes" required> أواﻓﻖ ﻋﻠﻰ اﻟﺸﺮوط واﻷﺣﻜﺎم</label>
<label for="notes">ﻣﻼﺣﻈﺎت إﺿﺎﻓﻴﺔ:</label>
<textarea id="notes" name="notes" rows="3" placeholder="أدﺧﻞ ﻣﻼﺣﻈﺎت اﺧﺘﻴﺎرﻳﺔ..."></textarea>
<button type="submit">إرﺳﺎل اﻟﺘﺴﺠﻴﻞ</button>
<button type="reset">إﻋﺎدة ﺗﻌﻴﻴﻦ اﻟﻨﻤﻮذج</button>
            </form>
    </body>
</html>
